# OpenClaw (gateway privado da Roberta 2.0). Sem portas públicas: publica apenas na interface docker_gwbridge.
# Requer .env no mesmo diretório com OPENCLAW_GATEWAY_TOKEN e OPENCLAW_PUBLISH_IP (não versionado).
services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest
    env_file:
      - path: .env
        required: true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_DISABLE_BONJOUR: "1"
      TZ: America/Sao_Paulo
    volumes:
      - ./openclaw/config:/home/node/.openclaw
      - ./openclaw/workspace:/home/node/.openclaw/workspace
      - ./openclaw/secrets:/home/node/.config/openclaw
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${OPENCLAW_PUBLISH_IP}:18789:18789"
    init: true
    restart: unless-stopped
    mem_limit: 3g
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
